# Alerting rules for the WireGuard hub and nodes. Deployed by hand:
# copy to /etc/prometheus/rules/ on the metrics VPS (see prometheus/ALERTING.md).
# Validate: promtool check rules wg-hub-alerts.yml
groups:
  - name: availability
    rules:
      - alert: HubDown
        expr: up{job="wg-hub"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hub is unreachable for monitoring"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for over 2 minutes — the hub, node_exporter or the metrics-VPS tunnel is down."

      - alert: NodeDown
        expr: up{job!="wg-hub"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.job }} is unreachable"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) has not responded for over 3 minutes."

      - alert: CollectorsStale
        expr: time() - node_textfile_mtime_seconds{job="wg-hub"} > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hub metric collectors are stale"
          description: "File {{ $labels.file }} has not been refreshed for over 2 minutes — check hub-metrics-textfile.timer on the hub."

  - name: overlay
    rules:
      - alert: SiteTunnelDown
        expr: time() - wireguard_peer_latest_handshake_seconds{job="wg-hub",kind="site"} > 300
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Site {{ $labels.peer }} lost its tunnel"
          description: "No WireGuard handshake for over 5 minutes — the site router is offline or lost internet."

      - alert: ServiceTunnelDown
        expr: time() - wireguard_peer_latest_handshake_seconds{job="wg-hub",kind="service"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.peer }} lost its tunnel"
          description: "No WireGuard handshake for over 5 minutes."

      # Info event: FIRING = client connected, RESOLVED = disconnected.
      - alert: ClientSession
        expr: (time() - wireguard_peer_latest_handshake_seconds{job="wg-hub",kind="client"}) < 180
        for: 45s
        labels:
          severity: info
        annotations:
          summary: "Client {{ $labels.peer }} is online"
          description: "Session event: FIRING — connected, RESOLVED — disconnected."

      - alert: ExitSwitched
        expr: changes(wireguard_exit_active{job="wg-hub"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Exit site switched"
          description: "Exit status of {{ $labels.site }} changed within the last 5 minutes (failover or preempt)."

      - alert: ExitOnBackup
        expr: wireguard_exit_active{job="wg-hub"} == 1 unless on(site) bottomk(1, wireguard_exit_priority{job="wg-hub"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Exit is running on backup: {{ $labels.site }}"
          description: "Home-client internet egresses via a backup site — the primary exit is not announcing a default route."

      - alert: FailClosed
        expr: wireguard_exit_default_present{job="wg-hub"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Home clients have no internet (fail-closed)"
          description: "No exit site announces 0.0.0.0/0 — only the unreachable floor is left in table 123."

  - name: bgp
    rules:
      - alert: BGPSessionDown
        expr: bgp_peer_up{job="wg-hub"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BGP session with {{ $labels.site }} is down"
          description: "Session with {{ $labels.neighbor }} is not in the Established state."

      - alert: BGPPrefixesMissing
        expr: bgp_peer_up{job="wg-hub"} == 1 and bgp_peer_prefixes_received{job="wg-hub"} < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.site }} is not announcing all prefixes"
          description: "Received {{ $value }} prefixes instead of 2 — most likely the site's WAN died (default withdrawn), or the LAN announcement is gone."

  - name: system
    rules:
      - alert: HighCPU
        expr: 100 * (1 - avg by (instance, job) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load: {{ $labels.job }}"
          description: "CPU on {{ $labels.instance }} above {{ $value | printf \"%.0f\" }}% for over 15 minutes."

      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low free memory: {{ $labels.job }}"
          description: "{{ $value | printf \"%.0f\" }}% of RAM used on {{ $labels.instance }} for over 15 minutes."

      - alert: DiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk running low: {{ $labels.job }}"
          description: "Less than 15% of the root filesystem is free on {{ $labels.instance }}."

      - alert: DiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk almost full: {{ $labels.job }}"
          description: "Less than 5% of the root filesystem is free on {{ $labels.instance }}."

      - alert: InstanceRebooted
        expr: time() - node_boot_time_seconds < 300
        labels:
          severity: info
        annotations:
          summary: "Node rebooted: {{ $labels.job }}"
          description: "{{ $labels.instance }} booted less than 5 minutes ago."

  - name: certs
    rules:
      - alert: CertExpirySoon
        expr: hub_cert_expiry_timestamp_seconds{job="wg-hub"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Wildcard certificate expires soon"
          description: "Less than 14 days left on *.in.threadnull.dev — lego renews at <30 days, so renewal has been broken (journalctl -u lego-renew on the hub)."

# Alertmanager for the WireGuard overlay. Deployed by hand: copy to
# /etc/prometheus/alertmanager.yml on the metrics VPS and set chat_id in
# BOTH receivers (see prometheus/ALERTING.md). The bot token lives in a
# separate file (bot_token_file) and never enters the repo or this config.
global:
  resolve_timeout: 5m

templates:
  - /etc/prometheus/telegram.tmpl

route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 24h
  routes:
    # One-shot events (client connect/disconnect, exit switch, reboots):
    # separate message per entity, fast delivery, no resolved messages
    # (the receiver has send_resolved: false).
    - matchers: ['event="true"']
      receiver: telegram-events
      group_by: [alertname, peer, site]
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 12h
    - matchers: ['severity="critical"']
      group_wait: 5s
      repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/prometheus/telegram_bot_token
        chat_id: 0  # CHANGE ME: numeric chat id from getUpdates
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true
  - name: telegram-events
    telegram_configs:
      - bot_token_file: /etc/prometheus/telegram_bot_token
        chat_id: 0  # CHANGE ME: numeric chat id from getUpdates
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: false

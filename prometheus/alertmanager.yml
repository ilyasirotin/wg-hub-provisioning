# Alertmanager for the WireGuard overlay. Deployed by hand: copy to
# /etc/prometheus/alertmanager.yml on the metrics VPS and set chat_id
# (see prometheus/ALERTING.md). The bot token lives in a separate file
# (bot_token_file) and never enters the repo or this config.
#
# No resolved messages anywhere (send_resolved: false): recovery is
# communicated by the next meaningful event (e.g. site_a comes back ->
# "Exit switched to site_a"), not by ✅ RESOLVED tails.
global:
  resolve_timeout: 5m

templates:
  - /etc/prometheus/telegram.tmpl

route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 24h
  routes:
    # MikroTik monitoring (routers/extender/switch) goes to a dedicated
    # bot (same chat, different sender). Must be FIRST: mikrotik alerts
    # carry severity labels too and would otherwise match the routes below.
    - matchers: ['component="mikrotik"']
      receiver: telegram-mikrotik
      routes:
        - matchers: ['severity="critical"']
          group_wait: 5s
          repeat_interval: 4h
    # One-shot events (client connect/disconnect, exit switch, reboots):
    # separate message per entity, fast delivery.
    - matchers: ['event="true"']
      group_by: [alertname, peer, site]
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 12h
    - matchers: ['severity="critical"']
      group_wait: 5s
      repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/prometheus/telegram_bot_token
        chat_id: 0  # CHANGE ME: numeric chat id from getUpdates
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: false

  - name: telegram-mikrotik
    telegram_configs:
      - bot_token_file: /etc/prometheus/telegram_bot_token_mikrotik
        chat_id: 0  # CHANGE ME: numeric chat id from getUpdates
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: false

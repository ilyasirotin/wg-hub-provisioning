---
# Hub: WireGuard + zoned nftables + dnsmasq (internal zone).
# Peer changes are applied via `wg syncconf` (no tunnel restarts);
# routes/PBR live in a separate unit, firewall fully in nftables.
- name: Install packages
  ansible.builtin.apt:
    name: [wireguard, dnsmasq]
    state: present

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: Create key directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/wireguard
    - /etc/wireguard/clients

- name: Build unified peer list
  ansible.builtin.set_fact:
    wg_all_peers: >-
      {%- set peers = [] -%}
      {%- for sid, s in sites.items() -%}
        {%- set _ = peers.append(s | combine({'kind': 'site', 'name': sid})) -%}
      {%- endfor -%}
      {%- for c in clients -%}
        {%- set _ = peers.append(c | combine({'kind': 'client'})) -%}
      {%- endfor -%}
      {%- for s in services -%}
        {%- set _ = peers.append(s | combine({'kind': 'service'})) -%}
      {%- endfor -%}
      {{ peers }}

- name: Generate server keys
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    wg genkey | tee /etc/wireguard/server.priv | wg pubkey > /etc/wireguard/server.pub
  args:
    executable: /bin/bash
    creates: /etc/wireguard/server.priv

- name: Generate peer keypairs
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    wg genkey | tee /etc/wireguard/clients/{{ item.name }}.priv | wg pubkey > /etc/wireguard/clients/{{ item.name }}.pub
  args:
    executable: /bin/bash
    creates: "/etc/wireguard/clients/{{ item.name }}.priv"
  loop: "{{ wg_all_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate peer PSKs
  ansible.builtin.shell: umask 077; wg genpsk > /etc/wireguard/clients/{{ item.name }}.psk
  args:
    executable: /bin/bash
    creates: "/etc/wireguard/clients/{{ item.name }}.psk"
  loop: "{{ wg_all_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Tighten private material permissions
  ansible.builtin.shell: chmod 600 /etc/wireguard/server.priv /etc/wireguard/clients/*.priv /etc/wireguard/clients/*.psk
  changed_when: false

- name: Read server keys
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: _server_keys
  loop:
    - /etc/wireguard/server.priv
    - /etc/wireguard/server.pub
  no_log: true

- name: Read peer keys
  ansible.builtin.slurp:
    src: "/etc/wireguard/clients/{{ item.0.name }}.{{ item.1 }}"
  register: _peer_keys
  loop: "{{ wg_all_peers | product(['priv', 'pub', 'psk']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  no_log: true

- name: Parse keys into dictionaries
  ansible.builtin.set_fact:
    wg_server_keys: >-
      {{ dict(_server_keys.results | map(attribute='source') | map('basename')
         | zip(_server_keys.results | map(attribute='content') | map('b64decode') | map('trim'))) }}
    wg_peer_data: >-
      {%- set data = {} -%}
      {%- for res in _peer_keys.results -%}
        {%- set kname = res.item.0.name -%}
        {%- set ktype = res.item.1 -%}
        {%- if kname not in data -%}{%- set _ = data.update({kname: {}}) -%}{%- endif -%}
        {%- set _ = data[kname].update({ktype: res.content | b64decode | trim}) -%}
      {%- endfor -%}
      {{ data }}
  no_log: true

- name: Deploy wg0.conf (interface + peers only, no firewall/routes)
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/{{ wg_interface }}.conf
    mode: "0600"
    validate: "wg-quick strip %s"
  notify: Sync WireGuard peers

- name: Deploy routing script (overlay/site routes, home-profile PBR)
  ansible.builtin.template:
    src: wg0-routes.sh.j2
    dest: /usr/local/sbin/wg0-routes.sh
    mode: "0755"
  notify: Apply WireGuard routes

- name: Deploy wg0-routes systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/wg0-routes.service
    mode: "0644"
    content: |
      [Unit]
      Description=Routing rules for {{ wg_interface }} (generated by Ansible)
      After=wg-quick@{{ wg_interface }}.service
      BindsTo=wg-quick@{{ wg_interface }}.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/wg0-routes.sh up
      ExecStop=/usr/local/sbin/wg0-routes.sh down

      [Install]
      WantedBy=wg-quick@{{ wg_interface }}.service
  notify: Apply WireGuard routes

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Disable systemd-resolved if present (frees port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: no
  failed_when: false

# The hub's OWN resolver must be independent of dnsmasq and the overlay:
# dnsmasq binds only the overlay IP (10.99.0.1) and serves VPN clients,
# while the hub itself needs to resolve Let's Encrypt/apt at all times,
# including during bootstrap before any site peer is up. Pin a static
# public resolver and make it immutable so the dnsmasq package / DHCP
# client cannot repoint it at a dead 127.0.0.1.
- name: Clear immutable flag on resolv.conf before managing
  ansible.builtin.command: chattr -i /etc/resolv.conf
  changed_when: false
  failed_when: false

- name: Replace any resolv.conf symlink (e.g. systemd-resolved stub)
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Pin the hub's own resolver to public servers
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Managed by Ansible. The hub resolves via public servers, independent
      # of dnsmasq (which serves VPN clients on the overlay IP only).
      {% for r in hub_resolvers %}
      nameserver {{ r }}
      {% endfor %}
  register: _resolv

- name: Make resolv.conf immutable so nothing clobbers it
  ansible.builtin.command: chattr +i /etc/resolv.conf
  changed_when: _resolv is changed
  failed_when: false

- name: Deploy dnsmasq internal-zone config
  ansible.builtin.template:
    src: dnsmasq-internal.conf.j2
    dest: /etc/dnsmasq.d/wg-internal.conf
    mode: "0644"
  notify: Restart dnsmasq

- name: Render personal client configs
  ansible.builtin.template:
    src: client.conf.j2
    dest: "/etc/wireguard/clients/{{ item.name }}.conf"
    mode: "0600"
  loop: "{{ clients }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Render MikroTik peer snippets (apply manually on each router)
  ansible.builtin.template:
    src: mikrotik-site.rsc.j2
    dest: "/etc/wireguard/clients/{{ item.name }}.rsc"
    mode: "0600"
  loop: "{{ wg_all_peers | selectattr('kind', 'equalto', 'site') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
    daemon_reload: yes
  loop:
    - "wg-quick@{{ wg_interface }}"
    - wg0-routes
    - nftables
    - dnsmasq

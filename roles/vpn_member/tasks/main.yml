---
# Service VPS as an overlay member.
# Prerequisite: declared in network.yml -> services, and hub.yml has been
# run (it creates this peer's keys). service_name is set in inventory.

- name: Resolve own service entry from the model
  ansible.builtin.set_fact:
    vpn_member_svc: "{{ services | selectattr('name', 'equalto', service_name) | first }}"
    vpn_member_hub_host: "{{ groups['hub'][0] }}"

- name: Install packages
  ansible.builtin.apt:
    name: [wireguard, openresolv]
    state: present

- name: Verify hub overlay connectivity before fetching keys
  ansible.builtin.wait_for:
    host: "{{ hostvars[vpn_member_hub_host].ansible_host }}"
    port: "{{ hostvars[vpn_member_hub_host].ansible_port | default(22) }}"
    timeout: 10
    msg: >-
      Cannot reach hub {{ vpn_member_hub_host }}
      ({{ hostvars[vpn_member_hub_host].ansible_host }}:{{ hostvars[vpn_member_hub_host].ansible_port }}).
      The Ansible control machine must be an active WireGuard overlay peer —
      start your WireGuard client and re-run.
  delegate_to: localhost

- name: Fetch peer keys from the hub
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: vpn_member_keys_raw
  delegate_to: "{{ vpn_member_hub_host }}"
  loop:
    - /etc/wireguard/server.pub
    - "/etc/wireguard/clients/{{ vpn_member_svc.name }}.priv"
    - "/etc/wireguard/clients/{{ vpn_member_svc.name }}.psk"
  no_log: true

- name: Parse keys
  ansible.builtin.set_fact:
    vpn_member_peer_keys: >-
      {{ dict(vpn_member_keys_raw.results | map(attribute='source') | map('basename')
         | zip(vpn_member_keys_raw.results | map(attribute='content') | map('b64decode') | map('trim'))) }}
  no_log: true

- name: Deploy wg0.conf
  ansible.builtin.template:
    src: wg0-member.conf.j2
    dest: /etc/wireguard/{{ wg_interface }}.conf
    mode: "0600"
    validate: "wg-quick strip %s"
  notify: Restart member WireGuard

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables-member.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable WireGuard and nftables
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - "wg-quick@{{ wg_interface }}"
    - nftables

# ----------------------- Certificate from the hub -----------------------

- name: Create cert-sync key directory
  ansible.builtin.file:
    path: /etc/wg-certs-sync
    state: directory
    mode: "0700"

- name: Generate cert-sync SSH key
  community.crypto.openssh_keypair:
    path: /etc/wg-certs-sync/id_ed25519
    type: ed25519
    mode: "0600"
  register: vpn_member_synckey

- name: Authorize this host on the hub (rrsync read-only, cert dir only)
  ansible.builtin.lineinfile:
    path: "/home/{{ cert_sync_user }}/.ssh/authorized_keys"
    create: true
    mode: "0600"
    owner: "{{ cert_sync_user }}"
    group: "{{ cert_sync_user }}"
    line: >-
      restrict,command="{{ hostvars[vpn_member_hub_host].certs_hub_rrsync_path | default('/usr/bin/rrsync') }} -ro {{ cert_publish_dir }}"
      {{ vpn_member_synckey.public_key }} {{ vpn_member_svc.name }}-certsync
  delegate_to: "{{ vpn_member_hub_host }}"
  become: true

- name: Create local cert directory
  ansible.builtin.file:
    path: /etc/wg-certs
    state: directory
    mode: "0750"

- name: Deploy cert-sync script
  ansible.builtin.template:
    src: cert-sync.sh.j2
    dest: /usr/local/sbin/cert-sync.sh
    mode: "0755"

- name: Deploy cert-sync service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: cert-sync.service
      content: |
        [Unit]
        Description=Pull wildcard certificate from hub
        After=wg-quick@{{ wg_interface }}.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/cert-sync.sh
    - name: cert-sync.timer
      content: |
        [Unit]
        Description=Daily certificate pull

        [Timer]
        OnCalendar=*-*-* 05:11:00
        RandomizedDelaySec=30m
        Persistent=true

        [Install]
        WantedBy=timers.target

- name: Enable cert-sync timer and run once
  ansible.builtin.systemd:
    name: cert-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Initial cert pull
  ansible.builtin.systemd:
    name: cert-sync.service
    state: started

# ----------------------- nginx TLS reverse proxy (optional) ---------------------

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  when: vpn_member_svc.nginx | default(false)

- name: Create nginx systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"
  when: vpn_member_svc.nginx | default(false)

- name: Make nginx wait for WireGuard before binding
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/wg-wait.conf
    mode: "0644"
    content: |
      [Unit]
      After=wg-quick@{{ wg_interface }}.service
  notify: Reload nginx
  when: vpn_member_svc.nginx | default(false)

- name: Allow www-data to read cert directory
  ansible.builtin.file:
    path: /etc/wg-certs
    state: directory
    mode: "0750"
    group: www-data
  when: vpn_member_svc.nginx | default(false)

- name: Deploy nginx reverse proxy config
  ansible.builtin.template:
    src: nginx-member.conf.j2
    dest: "/etc/nginx/sites-available/{{ vpn_member_svc.name }}"
    mode: "0644"
  notify: Reload nginx
  when: vpn_member_svc.nginx | default(false)

- name: Enable nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ vpn_member_svc.name }}"
    dest: "/etc/nginx/sites-enabled/{{ vpn_member_svc.name }}"
    state: link
  notify: Reload nginx
  when: vpn_member_svc.nginx | default(false)

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
  when: vpn_member_svc.nginx | default(false)

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
  when: vpn_member_svc.nginx | default(false)

---
- name: Restart member WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wg_interface }}"
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

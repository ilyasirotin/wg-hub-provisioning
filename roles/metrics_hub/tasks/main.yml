---
# Optional hub monitoring (toggle: hub_metrics_enabled in settings.yml).
# node_exporter serves system metrics on :{{ metrics_hub_port }} (bind stays
# wildcard on purpose: nftables gates access, and binding the overlay IP
# would kill metrics together with wg0 — exactly when they are needed).
# WireGuard / exit-failover / BGP metrics are textfile collectors: a timer
# writes .prom files into /var/lib/prometheus/node-exporter, no extra
# exporter daemons. The scrape hole in nftables is rendered by wg_hub
# (nftables.conf.j2) from the same toggle + metrics_hub_scrapers.

- name: Enable hub metrics
  when: hub_metrics_enabled | default(false)
  block:
    - name: Validate metrics scrapers exist in the model
      ansible.builtin.assert:
        that: >-
          metrics_hub_scrapers
          | difference(services | map(attribute='name') | list)
          | length == 0
        fail_msg: >-
          Every entry of metrics_hub_scrapers must be a service name from
          network.yml services (got: {{ metrics_hub_scrapers | join(', ') }}).

    - name: Install node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Configure node exporter (textfile collector directory)
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
        content: |
          # Managed by Ansible (roles/metrics_hub).
          ARGS="--collector.textfile.directory=/var/lib/prometheus/node-exporter"
      notify: Restart node exporter

    - name: Ensure textfile collector directory exists
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        mode: "0755"

    - name: Deploy WireGuard textfile collector
      ansible.builtin.template:
        src: wg-metrics-textfile.sh.j2
        dest: /usr/local/sbin/wg-metrics-textfile.sh
        mode: "0755"

    - name: Deploy BGP textfile collector
      ansible.builtin.template:
        src: bgp-metrics-textfile.py.j2
        dest: /usr/local/sbin/bgp-metrics-textfile.py
        mode: "0755"

    - name: Deploy textfile collector service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: hub-metrics-textfile.service
          content: |
            [Unit]
            Description=WireGuard/BGP metrics for node_exporter (generated by Ansible)

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/wg-metrics-textfile.sh
            ExecStart=/usr/local/sbin/bgp-metrics-textfile.py
        - name: hub-metrics-textfile.timer
          content: |
            [Unit]
            Description=Periodic WireGuard/BGP metrics refresh

            [Timer]
            OnBootSec={{ metrics_hub_interval }}
            OnUnitActiveSec={{ metrics_hub_interval }}
            AccuracySec=1s

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: Enable and start metrics services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - prometheus-node-exporter
        - hub-metrics-textfile.timer

# Honest toggle: disabling stops serving metrics immediately. Packages and
# rendered files stay on disk (re-enabling is a re-run away); the nftables
# scrape hole disappears on the same run via the wg_hub template.
- name: Disable hub metrics
  when: not (hub_metrics_enabled | default(false))
  block:
    - name: Stop and disable metrics services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - hub-metrics-textfile.timer
        - prometheus-node-exporter
      failed_when: false

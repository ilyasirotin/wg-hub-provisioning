---
# BGP scaffold for the WireGuard hub.
# This role installs FRR and wires up bgpd but does NOT replace the static
# routes in wg0-routes.sh. That migration is a separate operational step:
# 1. Apply this role.
# 2. Configure BGP peering on each site router (distinct private ASN).
# 3. Verify routes appear via `vtysh -c "show bgp ipv4 unicast"`.
# 4. Remove the matching static ip-route lines from wg0-routes.sh.j2.
#
# To wire this role in: add `frr_hub` to the role list in playbooks/hub.yml
# after `wg_hub`.

- name: Install frr
  ansible.builtin.apt:
    name: frr
    state: present
    update_cache: false

- name: Deploy frr daemons config (enable bgpd)
  ansible.builtin.template:
    src: frr-daemons.j2
    dest: /etc/frr/daemons
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Deploy frr.conf (BGP config)
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Enable and start frr
  ansible.builtin.systemd:
    name: frr.service
    enabled: true
    state: started
    daemon_reload: true

---
# FRRouting BGP on the hub: dynamic site LAN routes + exit-default election.
# Site routers peer over the overlay (bgp listen range — no per-site config
# here); exit-capable sites announce 0.0.0.0/0, elected by local-pref in
# frr.conf.j2. wg-exit-sync (roles/wg_hub) consumes the election result.
# Runs after wg_hub in playbooks/hub.yml — on a fresh install wg-exit-sync
# starts before FRR exists and simply stays fail-closed until bgpd is up.

- name: Install frr
  ansible.builtin.apt:
    name: frr
    state: present
    update_cache: false

- name: Deploy frr daemons config (enable bgpd)
  ansible.builtin.template:
    src: frr-daemons.j2
    dest: /etc/frr/daemons
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Deploy frr.conf (BGP config)
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart frr

- name: Enable and start frr
  ansible.builtin.systemd:
    name: frr.service
    enabled: true
    state: started
    daemon_reload: true

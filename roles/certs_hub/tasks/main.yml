---
# Wildcard *.{{ wg_domain }} via Let's Encrypt DNS-01 (Cloudflare).
# The token exists only on the hub. Services pull the finished cert
# read-only over rsync through the restricted certsync SSH account.

- name: Check vault token is set
  ansible.builtin.assert:
    that:
      - cloudflare_dns_api_token is defined
      - cloudflare_dns_api_token != "CHANGE_ME"
    fail_msg: "Set cloudflare_dns_api_token in group_vars/all/vault.yml (see vault.yml.example)"

- name: Install lego binary
  ansible.builtin.unarchive:
    src: "https://github.com/go-acme/lego/releases/download/v{{ lego_version }}/lego_v{{ lego_version }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [lego]
    mode: "0755"
    creates: /usr/local/bin/lego

- name: Create lego directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/lego
    - /var/lib/lego

- name: Deploy Cloudflare credentials
  ansible.builtin.copy:
    dest: /etc/lego/cloudflare.env
    mode: "0600"
    content: |
      CLOUDFLARE_DNS_API_TOKEN={{ cloudflare_dns_api_token }}
  no_log: true

- name: Deploy renew script
  ansible.builtin.template:
    src: lego-renew.sh.j2
    dest: /usr/local/sbin/lego-renew.sh
    mode: "0755"

- name: Deploy lego-renew service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: lego-renew.service
      content: |
        [Unit]
        Description=Obtain/renew wildcard certificate via lego
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        EnvironmentFile=/etc/lego/cloudflare.env
        ExecStart=/usr/local/sbin/lego-renew.sh
    - name: lego-renew.timer
      content: |
        [Unit]
        Description=Daily certificate renewal check

        [Timer]
        OnCalendar=*-*-* 04:17:00
        RandomizedDelaySec=30m
        Persistent=true

        [Install]
        WantedBy=timers.target
  notify: Reload systemd

- name: Enable renew timer
  ansible.builtin.systemd:
    name: lego-renew.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create certsync user (rsync read-only access to certs)
  ansible.builtin.user:
    name: "{{ cert_sync_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true
    home: "/home/{{ cert_sync_user }}"

- name: Create cert publish directory
  ansible.builtin.file:
    path: "{{ cert_publish_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ cert_sync_user }}"

- name: Run initial issuance (shows lego output directly on failure)
  ansible.builtin.command: /usr/local/sbin/lego-renew.sh
  environment:
    CLOUDFLARE_DNS_API_TOKEN: "{{ cloudflare_dns_api_token }}"
  register: _lego_run
  changed_when: "'Server responded with a certificate' in _lego_run.stdout or _lego_run.rc == 0"
  failed_when: _lego_run.rc != 0
  no_log: false

- name: Locate rrsync helper
  ansible.builtin.shell: command -v rrsync || ls /usr/share/rsync/scripts/rrsync 2>/dev/null | head -1
  register: _rrsync
  changed_when: false

- name: Remember rrsync path (used by vpn_member via hostvars)
  ansible.builtin.set_fact:
    _rrsync_path: "{{ _rrsync.stdout | trim }}"

- name: Make rrsync executable if shipped as a script
  ansible.builtin.file:
    path: "{{ _rrsync.stdout | trim }}"
    mode: "0755"
  when: _rrsync.stdout | trim | length > 0

- name: Prepare authorized_keys dir for certsync
  ansible.builtin.file:
    path: "/home/{{ cert_sync_user }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ cert_sync_user }}"
    group: "{{ cert_sync_user }}"

# Service public keys are added by the vpn_member role (delegate_to hub),
# each with command= rrsync -ro {{ cert_publish_dir }} - read-only access
# scoped to the certificate directory only.

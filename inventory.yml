all:
  children:
    hub:
      hosts:
        hub-ams3:
          # The overlay address. SSH stays on port 22; the DigitalOcean
          # Cloud Firewall (managed in the DO panel, not here) is what
          # closes it to the internet, so the control machine must be a
          # connected overlay peer.
          ansible_host: 10.99.0.1
          ansible_user: ops
          ansible_port: 22
          # First run on a fresh droplet, before the overlay exists and
          # before the Cloud Firewall is attached:
          #   ansible-playbook playbooks/hub.yml \
          #     -e ansible_host=<droplet-public-ip> --ask-vault-pass

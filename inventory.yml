all:
  children:
    hub:
      hosts:
        vps-relay-01:
          ansible_host: 10.99.0.1
          ansible_user: wg
          ansible_port: 5860
          # First run on a fresh server (sshd still on 22):
          #   ansible-playbook playbooks/hub.yml -e ansible_port=22
          # sshd moves to 5860 at the end of that run.
    # Service VPSes. On bootstrap ansible_host is the public IP from the
    # Hetzner panel; once the host is inside the overlay, switch it to the
    # wg address and set member_public_ssh: false.
    services:
      hosts:
        ha-vps:
          ansible_host: 65.21.187.190    # public IP during bootstrap
          ansible_user: ha
          ansible_port: 5860             # 22 on the very first run
          service_name: ha               # entry name in network.yml
          # member_public_ssh: false       # SSH only via wg0; emergency access via Hetzner console

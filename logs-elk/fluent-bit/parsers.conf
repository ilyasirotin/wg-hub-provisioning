# Fluent Bit parsers. This file is mounted OVER the image's default
# /fluent-bit/etc/parsers.conf, so the built-in parsers we rely on
# (syslog-rfc3164, json) are re-declared here explicitly.

# RFC3164 BSD syslog — MikroTik sends this with `bsd-syslog=yes`.
# RouterOS uses its /system identity as the syslog hostname (<host>), so set a
# stable identity per router (site-a / site-b / extender) to distinguish them.
[PARSER]
    Name        syslog-rfc3164
    Format      regex
    Regex       /^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   on

# Generic JSON — for structured app logs (Go/PHP) emitted to stdout and picked
# up from journald (MESSAGE field). Applied by a targeted filter, see
# fluent-bit.conf / fluent-bit-shipper.conf.
[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Keep   on

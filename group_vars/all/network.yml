# =====================================================================
# NETWORK MODEL
# This is the only file you edit to add, remove, or renumber a peer.
# Every artefact is generated from it: the [Peer] blocks in wg0.conf,
# the routes in wg0-routes.sh, the dnsmasq host-records, the client
# .conf files, and the MikroTik .rsc snippets.
#
# ADDRESS PLAN
#   Overlay (WireGuard)       10.99.0.0/24
#     10.99.0.1               hub
#     10.99.0.11 - .19        site routers
#     10.99.0.20 - .99        personal devices
#     10.99.0.100 - .199      service VPSes
#   Site LANs                 10.<site>.0.0/16
#     VLAN k of site N        10.N.<k>.0/24
#   The ranges are an organisational convention for readability in
#   `wg show`; they carry no policy. Every peer has identical,
#   unrestricted access to the overlay. 99 is reserved for the overlay
#   and is never a site number.
# =====================================================================

wg_domain: in.threadnull.dev
wg_network: 10.99.0.0/24
wg_port: 51820
wg_interface: wg0

hub_overlay_ip: 10.99.0.1
hub_public_endpoint: 134.122.63.146   # Endpoint in every generated client config

# ---------------------------------------------------------------------
# Peers.
#   name          required. Also the key file name in /etc/wireguard/peers.
#   address       required. Overlay address, no prefix.
#   lan_supernet  optional. Presence means "this peer routes a LAN":
#                 it adds the supernet to AllowedIPs, installs a route
#                 via this peer, and generates a MikroTik .rsc snippet.
#   dns_name      optional. Defaults to name with '_' replaced by '-'.
#
# Adding a peer: append a block, run playbooks/hub.yml, hand the
# generated /etc/wireguard/peers/<name>.conf (or .rsc) to the device.
# Existing sessions are not interrupted - see README.
# ---------------------------------------------------------------------
peers:
  - name: site_a
    address: 10.99.0.11
    lan_supernet: 10.1.0.0/16
    dns_name: router-a

  - name: site_b
    address: 10.99.0.12
    lan_supernet: 10.2.0.0/16
    dns_name: router-b

  # Example service VPS (no LAN behind it):
  # - name: metrics
  #   address: 10.99.0.100
  #
  # Example personal device:
  # - name: pixel
  #   address: 10.99.0.20

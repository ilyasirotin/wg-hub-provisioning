# Operational settings (rarely change).

# Service account the playbook runs as. Created by hand before the first
# run (see README, "Prerequisites") - Ansible only maintains its sudoers
# entry.
ops_user: ops

# The hub's OWN system resolver, independent of dnsmasq and the overlay.
# Public servers so apt and outbound requests always resolve, even when
# dnsmasq is down or no peer is connected. Written to /etc/resolv.conf,
# which is then made immutable.
hub_resolvers:
  - 1.1.1.1
  - 8.8.8.8

# Where dnsmasq forwards everything outside {{ wg_domain }}. Queried by
# the hub itself, so resolution never depends on a site being reachable.
# NextDNS anycast first, Cloudflare as a last-resort fallback.
# IPv4 only: with strict-order an unreachable IPv6 upstream listed first
# stalls every lookup on a droplet without IPv6.
dns_upstreams:
  - 45.90.28.0
  - 45.90.30.0
  - 1.1.1.1

# node_exporter binds the overlay address only; nftables opens this port
# to wg0. System metrics only - WireGuard peer state is read from
# `wg show` by the admin panel, not scraped.
node_exporter_port: 9100

# Fluent Bit — AGGREGATOR on the logs VPS (10.99.0.101).
# Runs alongside Elasticsearch + Kibana (docker-compose.yml, host networking).
#
# Inputs:
#   1. Router syslog (MikroTik site_a/site_b/extender) — RFC3164 over udp/514.
#   2. Local journald — this host + all its containers (docker journald driver).
# Output: local Elasticsearch (127.0.0.1:9200), daily indices logs-YYYY.MM.DD.

[SERVICE]
    flush         1
    daemon        off
    log_level     info
    parsers_file  parsers.conf

# ---------- 1. MikroTik remote syslog (routers + extender) ----------
# Reachable on wg0 because the container uses host networking and the hub
# permits @site_nets -> 10.99.0.101 udp/514 (network.yml service "logs").
[INPUT]
    name          syslog
    mode          udp
    listen        0.0.0.0
    port          514
    parser        syslog-rfc3164
    tag           routers.syslog

[FILTER]
    name          modify
    match         routers.*
    add           log_source router

# ---------- 2. Local host + container logs (journald) ----------
[INPUT]
    name              systemd
    tag               host.journal
    read_from_tail    on
    strip_underscores on

[FILTER]
    name          modify
    match         host.*
    rename        MESSAGE  message
    rename        HOSTNAME host
    add           log_source vps

# ---------- (optional) parse structured JSON app logs ----------
# Go/PHP services that log JSON to stdout land in journald with the JSON string
# in `message` and CONTAINER_NAME set by the docker journald driver. Enable a
# targeted parse to explode it into fields (level, msg, trace_id, ...):
#
# [FILTER]
#     name          parser
#     match         host.*
#     key_name      message
#     parser        json
#     reserve_data  on
#     preserve_key  on
#
# Scope it (e.g. only your app containers) via a nest/rewrite_tag rule if the
# blanket parse gets noisy against non-JSON unit logs.

# ---------- Output: Elasticsearch ----------
[OUTPUT]
    name              es
    match             *
    host              127.0.0.1
    port              9200
    http_user         elastic
    http_passwd       ${ELASTIC_PASSWORD}
    tls               off
    suppress_type_name on
    logstash_format   on
    logstash_prefix   logs
    time_key          @timestamp
    retry_limit       5

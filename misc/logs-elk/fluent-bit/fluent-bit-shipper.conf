# Fluent Bit — SHIPPER for a service VPS (e.g. metrics, 10.99.0.100).
# Ships local journald (host + containers via the docker journald driver) to
# the central Elasticsearch on the logs VPS over the overlay.
#
# Deploy as a container with HOST NETWORKING (same rationale as mktxp: the VPS
# nftables forward chain drops bridge-network egress; host networking pins the
# source to wg0 10.99.0.x and reaches 10.99.0.101:9200, which the hub permits
# via `tcp/9200 from services`).
#
#   docker run -d --name fluent-bit --network host --restart unless-stopped \
#     -e ELASTIC_PASSWORD=... \
#     -v $PWD/fluent-bit-shipper.conf:/fluent-bit/etc/fluent-bit.conf:ro \
#     -v $PWD/parsers.conf:/fluent-bit/etc/parsers.conf:ro \
#     -v /var/log/journal:/var/log/journal:ro -v /etc/machine-id:/etc/machine-id:ro \
#     fluent/fluent-bit:3.1.9
#
# EDIT `host_name` below per VPS before deploying.

[SERVICE]
    flush         1
    daemon        off
    log_level     info
    parsers_file  parsers.conf

[INPUT]
    name              systemd
    tag               host.journal
    read_from_tail    on
    strip_underscores on

[FILTER]
    name          modify
    match         host.*
    rename        MESSAGE  message
    rename        HOSTNAME host
    add           log_source vps
    add           host_name metrics          # <-- change per VPS

# Optional JSON app-log parsing — see fluent-bit.conf for the pattern.

[OUTPUT]
    name              es
    match             *
    host              10.99.0.101
    port              9200
    http_user         elastic
    http_passwd       ${ELASTIC_PASSWORD}
    tls               off
    suppress_type_name on
    logstash_format   on
    logstash_prefix   logs
    time_key          @timestamp
    retry_limit       5

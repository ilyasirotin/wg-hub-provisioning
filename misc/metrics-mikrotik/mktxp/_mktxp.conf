# mktxp exporter (system) settings. Mounted at /home/mktxp/mktxp/_mktxp.conf.
# Router entries and collector toggles live in mktxp.conf next to this file.
#
# NOTE: mktxp reads several of these keys unconditionally (KeyError on a
# missing one), so this is the FULL [MKTXP] set - do not trim it down.

[MKTXP]
    # Host networking: bind loopback only, /metrics is unauthenticated.
    listen = '127.0.0.1:49090'
    socket_timeout = 5

    initial_delay_on_failure = 120
    max_delay_on_failure = 900
    delay_inc_div = 5

    # Never enable: runs bandwidth tests against the routers.
    bandwidth = False
    bandwidth_test_dns_server = 8.8.8.8
    bandwidth_test_interval = 600

    minimal_collect_interval = 5
    verbose_mode = False

    # Two routers, one scrape - fetch them concurrently. site-b is remote
    # (higher RTT through the hub): a full collection takes ~15-20s, so the
    # budgets are generous; Prometheus scrapes every 60s with a 55s timeout
    # (scrape-mikrotik.yml).
    fetch_routers_in_parallel = True
    max_worker_threads = 3
    max_scrape_duration = 50
    total_max_scrape_duration = 55

    http_server_threads = 16
    persistent_router_connection_pool = True
    persistent_dhcp_cache = True
    compact_default_conf_values = False
    prometheus_headers_deduplication = False
    probe_connection_pool = False
    probe_connection_pool_ttl = 300
    probe_connection_pool_max_size = 128
